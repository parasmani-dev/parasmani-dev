name: Activity Overview

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "activity-overview.svg"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests -q

      - name: Generate activity-overview.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: parasmani-dev
        run: python3 generate_activity.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-overview.svg
          git diff --staged --quiet || (git commit -m "chore: update activity overview [skip ci]" && git push)