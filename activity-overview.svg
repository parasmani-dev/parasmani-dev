<svg xmlns="http://www.w3.org/2000/svg" width="460" height="280" viewBox="0 0 460 280">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="460" height="280" rx="6" fill="#0d1117"/>

  <!-- Crosshair grid lines -->
  <line x1="166" y1="140" x2="370" y2="140"
        stroke="#30363d" stroke-width="1"/>
  <line x1="268" y1="38" x2="268" y2="242"
        stroke="#30363d" stroke-width="1"/>

  <!-- Star fill -->
  <polygon points="181.06395939086295,140 268,134 274,140 268,146" fill="#1a7f37" fill-opacity="0.22"/>

  <!-- Star outline (glowing) -->
  <polygon points="181.06395939086295,140 268,134 274,140 268,146" fill="none" stroke="#3fb950" stroke-width="1.6"
           filter="url(#glow)"/>

  <!-- Arm-tip dots -->
  <circle cx="181.06395939086295" cy="140"  r="3.5" fill="#3fb950" filter="url(#glow)"/>
  <circle cx="274" cy="140"  r="3.5" fill="#3fb950" filter="url(#glow)"/>
  <circle cx="268" cy="134"  r="3.5" fill="#3fb950" filter="url(#glow)"/>
  <circle cx="268" cy="146"  r="3.5" fill="#3fb950" filter="url(#glow)"/>

  <!-- Centre dot -->
  <circle cx="268" cy="140" r="5" fill="#3fb950" filter="url(#cglow)"/>

  <!-- ── Labels ── -->

  <!-- Code review (top) -->
  <text x="268" y="26"
        fill="#e6edf3" font-size="13" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">1%</text>
  <text x="268" y="39"
        fill="#8b949e" font-size="11"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Code review</text>

  <!-- Commits (left) -->
  <text x="160" y="133"
        fill="#e6edf3" font-size="13" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">91%</text>
  <text x="160" y="149"
        fill="#8b949e" font-size="11"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">Commits</text>

  <!-- Issues (right) -->
  <text x="376" y="133"
        fill="#e6edf3" font-size="13" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">3%</text>
  <text x="376" y="149"
        fill="#8b949e" font-size="11"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start">Issues</text>

  <!-- Pull requests (bottom) -->
  <text x="268" y="253"
        fill="#e6edf3" font-size="13" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">6%</text>
  <text x="268" y="267"
        fill="#8b949e" font-size="11"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">Pull requests</text>
</svg>
